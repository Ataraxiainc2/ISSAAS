<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muse Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0d1017; --panel:#161b24; --panel2:#1b2130; --line:#2a3242; --text:#eef1f6; --muted:#a3adbd;
          --accent:#6cb4ff; --ok:#56d39b; --bad:#ff7b7b; --warn:#f5c85c;
          --sans:'Inter', system-ui, sans-serif; --mono:'JetBrains Mono', ui-monospace, Consolas, monospace; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 var(--sans); -webkit-font-smoothing:antialiased; }
  header { position:sticky; top:0; z-index:2; background:var(--bg); padding:12px 20px; border-bottom:1px solid var(--line);
           display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:17px; font-weight:600; margin:0; letter-spacing:-.01em; }
  .pill { padding:3px 10px; border-radius:99px; border:1px solid var(--line); color:var(--muted); font-size:12.5px; }
  .live { color:var(--warn); border-color:var(--warn); }
  .done { color:var(--ok); border-color:var(--ok); }
  .hbtn { margin-left:auto; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px;
          padding:5px 12px; font:500 13px var(--sans); cursor:pointer; }
  .hbtn.on { border-color:var(--warn); color:var(--warn); }
  main { display:grid; grid-template-columns:280px 1fr; height:calc(100vh - 56px); }
  nav { border-right:1px solid var(--line); padding:10px; overflow:auto; }
  nav button { display:block; width:100%; text-align:left; background:none; color:var(--text); border:1px solid transparent;
               border-radius:8px; padding:8px 10px; cursor:pointer; font:13px/1.45 var(--mono); word-break:break-all; }
  nav button:hover { background:var(--panel); }
  nav button.sel { background:var(--panel2); border-color:var(--accent); }
  nav h2, section h2 { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:18px 4px 8px; }
  #view { padding:8px 28px 40px; overflow:auto; min-width:0; }
  #view > * { max-width:1100px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
  pre { white-space:pre-wrap; word-break:break-word; margin:0; font:13.5px/1.65 var(--mono); color:var(--text); }
  .kv { display:grid; grid-template-columns:max-content 1fr; gap:6px 16px; font-size:14px; }
  .kv span:nth-child(odd) { color:var(--muted); }
  .kv span:nth-child(even) { font-family:var(--mono); font-size:13px; word-break:break-all; }
  .reply { border-left:4px solid var(--accent); background:var(--panel2); }
  .reply pre { font:15px/1.7 var(--sans); }
  .call { color:var(--muted); font-size:12.5px; font-weight:500; margin:18px 0 6px; display:flex; align-items:center; gap:10px; }
  .call::after { content:''; flex:1; border-top:1px dashed var(--line); }
  details.tool { background:var(--panel); border:1px solid var(--line); border-radius:8px; margin:6px 0; }
  details.tool[open] { border-color:var(--accent); }
  details.tool summary { padding:8px 12px; cursor:pointer; font:500 13.5px var(--mono); list-style-position:inside; }
  details.tool summary:hover { background:var(--panel2); }
  details.tool pre { padding:12px 14px; border-top:1px solid var(--line); max-height:70vh; overflow:auto; background:#10141c; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .muted { color:var(--muted); }
  @media (max-width:760px) { main { grid-template-columns:1fr; height:auto; } nav { border-right:none; border-bottom:1px solid var(--line); max-height:200px; }
    #view { padding:8px 16px 32px; } }
</style>
</head>
<body>
<header><h1>Muse Console</h1><span class="pill">read-only · localhost</span><span id="state" class="pill"></span>
  <button id="pause" class="hbtn" title="Stop refreshing while you read">Pause live updates</button></header>
<main>
  <nav>
    <h2>Runs</h2><div id="runs"></div>
    <h2>Default config</h2><div class="card"><div id="config" class="kv"></div>
      <p class="muted" style="font-size:12px;margin:8px 0 0">Edit <code>tools/console/config.json</code>; the next run uses it.</p></div>
  </nav>
  <div id="view"><p class="muted">Select a run.</p></div>
</main>
<script>
let current = null, timer = null;
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const kv = obj => Object.entries(obj).map(([k, v]) => `<span>${esc(k)}</span><span>${esc(v)}</span>`).join('');

async function loadRuns() {
  const r = await (await fetch('/api/runs')).json();
  document.getElementById('config').innerHTML = kv(r.config);
  document.getElementById('runs').innerHTML = r.runs.map(x =>
    `<button data-run="${esc(x.run)}" class="${x.run === current ? 'sel' : ''}">${x.finished ? '' : '● '}${esc(x.run)}</button>`).join('');
  document.querySelectorAll('nav button[data-run]').forEach(b => b.onclick = () => select(b.dataset.run));
  if (!current && r.runs.length) select(r.runs[0].run);
}

async function select(run) {
  current = run;
  document.querySelectorAll('nav button[data-run]').forEach(b => b.classList.toggle('sel', b.dataset.run === run));
  await render();
}

let lastSig = '';
async function render() {
  const run = current;
  const d = await (await fetch('/api/run/' + encodeURIComponent(run))).json();
  if (run !== current) return;
  // re-render only when something changed, so expanded tool calls stay open
  const sig = run + '|' + JSON.stringify(d);
  if (sig === lastSig) return;
  lastSig = sig;
  const view = document.getElementById('view');
  const nearBottom = view.scrollHeight - view.scrollTop - view.clientHeight < 80;
  const keepTop = view.scrollTop;
  const st = document.getElementById('state');
  st.textContent = d.done ? 'finished' : 'running — live'; st.className = 'pill ' + (d.done ? 'done' : 'live');

  const m = d.meta, cfg = {};
  for (const k of ['model','reasoning_effort','max_model_steps','disable_web_tools','started','finished','exit_code','note'])
    if (m[k] !== undefined && m[k] !== null) cfg[k] = m[k];
  let usage = '<span class="muted">Not reported yet.</span>';
  if (d.usage) usage = d.usage.map(u => `<div class="kv">${kv({
      model: u.model, calls: u.calls, input_tokens: u.input_tokens, cached_tokens: u.cached_tokens,
      output_tokens: u.output_tokens, reasoning_tokens: u.reasoning_tokens ?? 0,
      cost_usd: u.cost_usd == null ? 'unknown model price' : '$' + u.cost_usd.toFixed(4)})}</div>`).join('');

  const timeline = d.items.map((it, i) => {
    if (it.type === 'model_call') return `<div class="call">— model call #${it.n} —</div>`;
    if (it.type === 'reply') return `<div class="card reply"><pre>${esc(it.text)}</pre></div>`;
    const cls = it.status === 'ok' ? 'ok' : it.status === 'running' ? 'muted' : 'bad';
    // the summary shows the first line of the status only; the full text stays in the expanded output
    const st = String(it.status || '').split('\n')[0];
    const short = st.length > 70 ? st.slice(0, 70) + '…' : st;
    return `<details class="tool" data-key="${esc(run)}#${i}"><summary>${esc(it.name)} <span class="${cls}">${esc(short)}</span></summary><pre>${esc(it.output || '(no output)')}</pre></details>`;
  }).join('');

  view.innerHTML = `
    <section><h2>Run</h2><div class="card"><div class="kv">${kv({run: m.run, prompt_file: m.prompt_file ?? '—'})}${kv(cfg)}</div>
      ${m.command ? `<details data-key="${esc(run)}#cmd" style="margin-top:8px"><summary class="muted">exact command</summary><pre>${esc(m.command)}</pre></details>` : ''}</div></section>
    <section><h2>Prompt sent</h2><div class="card"><pre>${esc(d.prompt ?? '(prompt file not found)')}</pre></div></section>
    <section><h2>Reasoning</h2><div class="card muted">Muse stores the model's reasoning encrypted, so its text is not readable here.
      Reasoning token counts are shown under Usage.</div></section>
    <section><h2>Model activity and replies (${d.model_calls} model calls)</h2>${timeline || '<p class="muted">Waiting for events…</p>'}</section>
    <section><h2>Usage and cost</h2><div class="card">${usage}</div></section>
    ${d.stderr.trim() ? `<section><h2>stderr</h2><div class="card"><pre>${esc(d.stderr)}</pre></div></section>` : ''}`;
  // re-open what the reader had open, and keep their scroll position
  view.querySelectorAll('details[data-key]').forEach(el => {
    if (openKeys.has(el.dataset.key)) el.open = true;
    el.addEventListener('toggle', () => { el.open ? openKeys.add(el.dataset.key) : openKeys.delete(el.dataset.key); });
  });
  view.scrollTop = (!d.done && nearBottom && openKeys.size === 0) ? view.scrollHeight : keepTop;
}

const openKeys = new Set();
let paused = false;
document.getElementById('pause').onclick = e => {
  paused = !paused;
  e.target.textContent = paused ? 'Resume live updates' : 'Pause live updates';
  e.target.classList.toggle('on', paused);
};

loadRuns();
timer = setInterval(async () => { if (paused) return; await loadRuns(); if (current) await render(); }, 2500);
</script>
</body>
</html>
