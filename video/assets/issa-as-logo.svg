<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1b35"/>
      <stop offset="55%" stop-color="#091022"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer ambient glow -->
  <circle cx="120" cy="120" r="102" fill="none" stroke="url(#rimGrad)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.45"/>

  <!-- Cyber Shield Base -->
  <path d="M120 18 L204 54 V118 C204 170 168 208 120 224 C72 208 36 170 36 118 V54 Z"
        fill="url(#shieldGrad)" stroke="url(#rimGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Inner Shield Rim -->
  <path d="M120 30 L192 61 V116 C192 161 161 194 120 209 C79 194 48 161 48 116 V61 Z"
        fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- ISSASODA Split Concentric Rings inside the Shield -->
  <!-- Left Half Outer Ring (White/Cyan) -->
  <path d="M120 58 A58 58 0 0 0 120 174 V156 A40 40 0 0 1 120 76 Z" fill="#f8fafc"/>
  <!-- Right Half Mid Ring (Cyan/Blue) -->
  <path d="M120 70 A46 46 0 0 1 120 162 V144 A28 28 0 0 0 120 88 Z" fill="#38bdf8"/>
  <!-- Left Half Inner Ring (White) -->
  <path d="M120 82 A34 34 0 0 0 120 150 V134 A18 18 0 0 1 120 98 Z" fill="#f8fafc"/>
  <!-- Right Half Core (Emerald Verified Node) -->
  <path d="M120 98 A18 18 0 0 1 120 134 Z" fill="url(#emeraldGrad)"/>

  <!-- Verification Checkmark Badge at Bottom Right of Shield -->
  <circle cx="172" cy="172" r="24" fill="#061224" stroke="#10b981" stroke-width="3"/>
  <path d="M161 172 L169 180 L184 164" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>