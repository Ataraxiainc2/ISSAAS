[project]
name = "issa-as"
version = "0.1.0"
description = "Issue Scouting, Solving and Attestation, Agentic Solver (Meta hackathon 2026)"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.0",
]

[project.scripts]
issa = "issa_as.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issa_as"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
